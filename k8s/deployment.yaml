apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-api
  template:
    metadata:
      labels:
        app: ml-api
    spec:
      containers:
      - name: ml-api
        image: ghcr.io/dsdickinson/demo-mlflow-cicd/ml-api:latest
        ports:
        - containerPort: 8000
      imagePullSecrets:
      - name: gh-regcred
