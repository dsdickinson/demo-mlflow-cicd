name: ML CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - "app/**"
      - "model/**"
      - "Dockerfile"
      - "requirements.txt"
      - ".dockerignore"
      - ".github/workflows/ml-ci-cd.yaml"
  workflow_dispatch:

jobs:
  train-and-register:
    runs-on: ubuntu-latest
    permissions:
        contents: read
        packages: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Clean MLflow state
      run: rm -rf mlruns

    # 🧠 Train + register model
    - name: Train and register model
      env:
        MLFLOW_TRACKING_URI: file:./mlruns
      run: |
        python app/train.py

    - name: Debug MLflow files
      run: |
        ls -R mlruns

    # Download model
    - name: Download production model
      env:
        MLFLOW_TRACKING_URI: file:./mlruns
      run: |
        python app/download_model.py

    # Set up QEMU for multi-platform emulation
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    # Set up Docker Buildx
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        provenance: false
        tags: ghcr.io/${{ github.repository }}/ml-api:latest
